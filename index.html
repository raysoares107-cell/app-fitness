<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitLife</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101214;
  color: white;
}

header {
  padding: 25px 20px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  color: #aaa;
}

.container {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: #1b1f23;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
}

.card h2 {
  margin-top: 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
  background: #35d06f;
  color: #07120b;
}

button:active {
  transform: scale(.98);
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #333;
  background: #252a2f;
  color: white;
}

.stat {
  display: flex;
  justify-content: space-between;
  background: #252a2f;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #181b1f;
  display: flex;
  justify-content: space-around;
  padding: 12px 5px;
}

.nav button {
  width: auto;
  margin: 0;
  padding: 10px 15px;
  background: transparent;
  color: #aaa;
}

.nav button.active {
  color: #35d06f;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.exercise {
  padding: 15px;
  background: #252a2f;
  border-radius: 12px;
  margin: 10px 0;
}

.exercise strong {
  display: block;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<header>
  <h1>💪 FitLife</h1>
  <p>Seu treino. Sua evolução.</p>
</header>

<div class="container">

  <!-- INÍCIO -->
  <section id="home" class="page active">

    <div class="card">
      <h2>🔥 Seu objetivo</h2>
      <p>Escolha seu objetivo para começar.</p>

      <select id="goal">
        <option>Perder gordura</option>
        <option>Ganhar massa muscular</option>
        <option>Definir o corpo</option>
        <option>Melhorar condicionamento</option>
      </select>

      <button onclick="salvarObjetivo()">Salvar objetivo</button>
    </div>

    <div class="card">
      <h2>📊 Seus dados</h2>

      <input id="peso" type="number" placeholder="Peso (kg)">
      <input id="altura" type="number" placeholder="Altura (cm)">
      <input id="idade" type="number" placeholder="Idade">

      <button onclick="calcularIMC()">Calcular IMC</button>

      <div id="resultado"></div>
    </div>

  </section>

  <!-- TREINOS -->
  <section id="treinos" class="page">

    <div class="card">
      <h2>🏋️ Treinos</h2>

      <button onclick="mostrarTreino('academia')">
        🏋️ Treino na academia
      </button>

      <button onclick="mostrarTreino('casa')">
        🏠 Treino em casa
      </button>
    </div>

    <div id="listaTreino"></div>

  </section>

  <!-- ALIMENTAÇÃO -->
  <section id="alimentacao" class="page">

    <div class="card">
      <h2>🍎 Alimentação</h2>
      <p>Registre uma refeição para acompanhar sua alimentação.</p>

      <input id="alimento" placeholder="Ex: arroz, frango, banana">

      <input id="calorias" type="number" placeholder="Calorias aproximadas">

      <button onclick="adicionarAlimento()">
        Adicionar alimento
      </button>
    </div>

    <div class="card">
      <h2>📋 Refeições</h2>
      <div id="refeicoes"></div>
    </div>

  </section>

  <!-- PERFIL -->
  <section id="perfil" class="page">

    <div class="card">
      <h2>👤 Meu perfil</h2>

      <input id="nome" placeholder="Seu nome">

      <button onclick="salvarPerfil()">
        Salvar perfil
      </button>

      <div id="perfilResultado"></div>
    </div>

  </section>

</div>

<div class="nav">

  <button class="active" onclick="abrirPagina('home', this)">
    🏠<br>Início
  </button>

  <button onclick="abrirPagina('treinos', this)">
    🏋️<br>Treinos
  </button>

  <button onclick="abrirPagina('alimentacao', this)">
    🍎<br>Comida
  </button>

  <button onclick="abrirPagina('perfil', this)">
    👤<br>Perfil
  </button>

</div>

<script>

function abrirPagina(pagina, botao) {

  document.querySelectorAll('.page').forEach(function(p) {
    p.classList.remove('active');
  });

  document.getElementById(pagina).classList.add('active');

  document.querySelectorAll('.nav button').forEach(function(b) {
    b.classList.remove('active');
  });

  botao.classList.add('active');
}

function salvarObjetivo() {

  const objetivo = document.getElementById("goal").value;

  localStorage.setItem("objetivo", objetivo);

  alert("Objetivo salvo: " + objetivo);
}

function calcularIMC() {

  const peso = parseFloat(document.getElementById("peso").value);
  const altura = parseFloat(document.getElementById("altura").value) / 100;

  if (!peso || !altura) {
    alert("Digite peso e altura.");
    return;
  }

  const imc = peso / (altura * altura);

  document.getElementById("resultado").innerHTML =
    `<div class="stat">
      <span>Seu IMC</span>
      <strong>${imc.toFixed(1)}</strong>
    </div>`;
}

function mostrarTreino(tipo) {

  let html = "";

  if (tipo === "academia") {

    html = `
      <div class="card">
        <h2>🏋️ Treino Academia</h2>

        <div class="exercise">
          <strong>Agachamento</strong>
          3 séries × 12 repetições
        </div>

        <div class="exercise">
          <strong>Supino</strong>
          3 séries × 10 repetições
        </div>

        <div class="exercise">
          <strong>Remada</strong>
          3 séries × 12 repetições
        </div>

        <div class="exercise">
          <strong>Desenvolvimento</strong>
          3 séries × 10 repetições
        </div>
      </div>
    `;

  } else {

    html = `
      <div class="card">
        <h2>🏠 Treino em Casa</h2>

        <div class="exercise">
          <strong>Agachamento</strong>
          3 séries × 15 repetições
        </div>

        <div class="exercise">
          <strong>Flexão</strong>
          3 séries × 10 repetições
        </div>

        <div class="exercise">
          <strong>Afundo</strong>
          3 séries × 10 cada perna
        </div>

        <div class="exercise">
          <strong>Abdominal</strong>
          3 séries × 15 repetições
        </div>
      </div>
    `;
  }

  document.getElementById("listaTreino").innerHTML = html;
}

function adicionarAlimento() {

  const alimento

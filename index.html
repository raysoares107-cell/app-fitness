<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitLife</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:15px;padding-bottom:80px}
h1{text-align:center;color:#00ff88}
.card{background:#222;padding:15px;border-radius:12px;margin:15px 0}
button{background:#00ff88;color:#000;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px}
input,select{width:95%;padding:12px;border-radius:8px;border:none;margin:5px 0;background:#333;color:#fff}
img{width:100%;border-radius:10px;margin-top:10px}
.exercicio{background:#2a2a2a;padding:12px;border-radius:10px;margin:10px 0;border-left:4px solid #00ff88}
iframe{width:100%;height:200px;border-radius:10px;border:none;margin-top:10px}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);overflow-y:auto;padding:15px;z-index:99}
</style>
</head>
<body>
<h1>💪 FitLife</h1>

<div class="card">
<h2>🔥 Treino de Hoje (Today's Workout)</h2>
<select id="diaTreino" onchange="mudarTreino()">
<option value="segunda">Segunda: Peito + Tríceps</option>
<option value="terca">Terça: Costas + Bíceps (Braço)</option>
<option value="quarta">Quarta: Pernas</option>
<option value="quinta">Quinta: Ombro + Abdômen</option>
</select>
<div id="previewTreino"></div>
<button onclick="abrirTreino()">Começar Treino (Start) ▶️</button>
</div>

<div id="modal">
<div class="card" style="margin-top:30px">
<h2 id="modalTitulo"></h2>
<div id="modalConteudo"></div>
<button onclick="document.getElementById('modal').style.display='none'" style="background:#ff4444;color:#fff">Fechar (Close) X</button>
</div>
</div>

<div class="card">
<h2>Calculadora IMC (BMI)</h2>
<input id="peso" type="number" placeholder="Peso kg">
<input id="altura" type="number" placeholder="Altura ex: 1.75">
<button onclick="let p=peso.value,a=altura.value;resultado.innerText='Seu IMC: '+(p/(a*a)).toFixed(1)">Calcular (Calculate)</button>
<p id="resultado"></p>
</div>

<script>
const treinos = {
segunda: [
 {nome:"Supino Reto (Bench Press)", img:"https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600", video:"https://www.youtube.com/embed/rT7DgCr-3pg", dica:"Iniciante: Deite, pés no chão, desça a barra até o peito devagar e empurre. 3x12. Cotovelo 45 graus."},
 {nome:"Flexão (Push-up)", img:"https://images.unsplash.com/photo-1598971639058-fab3c3109a00?w=600", video:"https://www.youtube.com/embed/IODxDxX7oi4", dica:"Mãos na largura do ombro, corpo reto. Desça até 90 graus. Se for difícil, apoie os joelhos."}
],
terca: [
 {nome:"Rosca Direta - Braço (Bicep Curl)", img:"https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=600", video:"https://www.youtube.com/embed/ykJmrZ5v0Oo", dica:"Iniciante: Em pé, cotovelos colados no corpo. Sobe o peso sem balançar. 3x12 com halter leve. Foco no bíceps!"},
 {nome:"Barra Fixa (Pull-up) ou Puxada", img:"https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=600", video:"https://www.youtube.com/embed/eGo4IYlbE5g", dica:"Se não faz barra, usa a máquina puxada na frente. Puxe até o queixo, desça devagar."}
],
quarta: [{nome:"Agachamento (Squat)", img:"https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=600", video:"https://www.youtube.com/embed/aclHkVaku9U", dica:"Pés na largura do ombro, bunda pra trás como se fosse sentar. Joelho não passa da ponta do pé."}],
quinta: [{nome:"Desenvolvimento Ombro", img:"https://images.unsplash.com/photo-1532029837206-abbe2b7620e3?w=600", video:"https://www.youtube.com/embed/qEwKCR5JCog", dica:"Sentado, empurra o halter pra cima sem arquear as costas. 3x12."}]
};

function mudarTreino(){
 let dia = document.getElementById('diaTreino').value;
 let lista = treinos[dia];
 document.getElementById('previewTreino').innerHTML = `<p>Hoje tem ${lista.length} exercícios - Hoje (Today) ${lista[0].nome} e mais...</p>`;
}
function abrirTreino(){
 let dia = document.getElementById('diaTreino').value;
 let lista = treinos[dia];
 let html = "";
 lista.forEach(ex => {
   html += `<div class="exercicio"><h3>${ex.nome}</h3><img src="${ex.img}"><p>👉 <b>Como fazer (Beginner):</b> ${ex.dica}</p><iframe src="${ex.video}" allowfullscreen></iframe></div>`;
 });
 document.getElementById('modalTitulo').innerText = document.getElementById('diaTreino').options[document.getElementById('diaTreino').selectedIndex].text;
 document.getElementById('modalConteudo').innerHTML = html;
 document.getElementById('modal').style.display='block';
}
mudarTreino();
</script>
</body>
</html>

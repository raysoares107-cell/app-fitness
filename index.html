<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitLife</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:15px}
h1{text-align:center;color:#00ff88}
.card{background:#222;padding:15px;border-radius:12px;margin:15px 0}
button{background:#00ff88;color:#000;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold}
input{width:95%;padding:10px;border-radius:6px;border:none;margin:5px 0}
</style>
</head>
<body>
<h1>💪 FitLife</h1>
<div class="card">
<h2>Calculadora IMC (BMI)</h2>
<input id="peso" type="number" placeholder="Peso kg">
<input id="altura" type="number" placeholder="Altura ex: 1.75">
<button onclick="let p=peso.value,a=altura.value;resultado.innerText='Seu IMC: '+(p/(a*a)).toFixed(1)">Calcular</button>
<p id="resultado"></p>
</div>
<div class="card">
<h2>Treino de Hoje</h2>
<p>Segunda: Peito + Tríceps</p>
<button onclick="alert('Bora treinar!')">Começar</button>
</div>
</body>
</html>
